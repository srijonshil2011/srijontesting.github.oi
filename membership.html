<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>সদস্য হতে চাই | সৃজনশীল তরুণ সংঘ</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header><div class="container nav"><a class="brand" href="index.html"><img src="assets/images/logo.png" alt="লোগো"><div><b>সৃজনশীল তরুণ সংঘ</b><small>নোয়াগাঁও, টুকেরবাজার, সিলেট</small></div></a><a class="btn" style="background:var(--green);color:white" href="index.html">← হোম</a></div></header><main class="section"><div class="container"><div class="title"><span>সদস্যপদ</span><h2>সদস্য হতে চাই</h2><p>নিচের ফরমটি পূরণ করে আবেদন করুন। Google Form/Sheets সংযোগ পরে যুক্ত করা যাবে।</p></div><div class="feature"><form id="membershipForm"><label>পূর্ণ নাম<br><input name="name" required></label><br><label>পিতার/অভিভাবকের নাম<br><input name="guardian"></label><br><label>মোবাইল নম্বর<br><input name="phone" required></label><br><label>ই-মেইল<br><input type="email" name="email"></label><br><label>ঠিকানা<br><textarea name="address" rows="3"></textarea></label><br><label>সদস্যের ধরন<br><select name="type"><option>সাধারণ সদস্য</option><option>প্রবাসী সদস্য</option><option>দাতা সদস্য</option><option>জুনিয়র সদস্য</option></select></label><br><label>কেন সদস্য হতে চান?<br><textarea name="reason" rows="4"></textarea></label><br><button class="btn" style="background:var(--green);color:white;border:0" type="submit">আবেদন জমা দিন</button><button class="btn" style="margin-left:8px;border:1px solid #ddd" type="button" onclick="window.print()">ফরম ডাউনলোড/প্রিন্ট</button></form></div></div></main><script>document.getElementById("membershipForm").addEventListener("submit",e=>{e.preventDefault();alert("ফরমটি প্রস্তুত হয়েছে। Google Sheets সংযোগ যুক্ত হলে তথ্য সরাসরি জমা হবে।");});</script></body></html>
